<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Undangan Digital</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HALAMAN PEMBUKA -->

<div id="cover">

    <h3>Undangan Pernikahan</h3>

    <h1 id="namaCover"></h1>

    <p>Kepada Yth.</p>

    <h2 id="namaTamu">Tamu Undangan</h2>

    <button id="btnBuka">
        Buka Undangan
    </button>

</div>

<!-- HALAMAN UTAMA -->

<div id="utama" class="hidden">
    <div class="bunga-atas">
🌸 🌿 🌸
<div class="bunga-bawah">
🌸 🌿 🌸
</div>
</div>

    <section class="hero">
<img
src="foto-cover.jpg"
class="foto-pasangan">
    <h1 id="namaHero"></h1>

    <p id="tanggalHero"></p>

</section>

    
<section class="countdown">

    <h2>Menuju Hari Bahagia</h2>

    <div id="timer"></div>

</section>
    <section>

        <h2>Lokasi Acara</h2>

        <a
        href="https://maps.google.com"
        target="_blank">

        Lihat Lokasi

        </a>

    </section>

</div>

<audio
id="musik"
loop>

<source
src="musik.mp3"
type="audio/mpeg">

</audio>

<script src="app.js"></script>

</body>
</html>
